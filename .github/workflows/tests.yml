name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows-python:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            pyproject.toml
      - name: Install pinned environment and project
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Run tests without datasets
        run: python -m unittest discover -s tests -v
